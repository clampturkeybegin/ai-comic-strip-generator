[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-strip-generator"
version = "0.4.2"
description = "Windows desktop tool that turns a script into a multi-panel AI comic strip."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
authors = [{ name = "aicomic contributors" }]
dependencies = [
    "PySide6>=6.7,<6.9",
    "torch>=2.3,<2.6",
    "diffusers>=0.30",
    "transformers>=4.42",
    "safetensors>=0.4",
    "Pillow>=10.3",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
aicomic = "aicomic.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true